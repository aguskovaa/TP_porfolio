<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <div class="perfil">
            <div class="info-perfil">
                <h1>Agustin Kovalsky</h1>
                <p>Portfolio personal</p>
            </div>
            <div class="contenedor-foto">
                <img src="foto.png" class="foto-perfil" alt="Foto de perfil">
            </div>
        </div>
        
        <div class="categorias">
            <div class="cajita habilidades" onclick="abrirZoom(this)">
                <img src="skills.jpg" class="imagen-cuadro" alt="Skills">
                
            </div>
            <div class="cajita sobre-mi" onclick="abrirZoom(this)">
                <img src="sobre-mi.jpg" class="imagen-cuadro" alt="Sobre mí">
                
            </div>
            <div class="cajita educacion" onclick="abrirZoom(this)">
                <img src="educacion.jpg" class="imagen-cuadro" alt="Educación">
                
            </div>
            <div class="cajita proyecto1" onclick="abrirZoom(this)">
                <img src="proyecto1.jpg" class="imagen-cuadro" alt="Proyecto 1">
                
            </div>
            <div class="cajita proyecto2" onclick="abrirZoom(this)">
                <img src="proyecto2.jpg" class="imagen-cuadro" alt="Proyecto 2">
               
            </div>
            <div class="cajita proyecto3" onclick="abrirZoom(this)">
                <img src="proyecto3.jpg" class="imagen-cuadro" alt="Proyecto 3">
               
            </div>
        </div>
    </div>

    <div id="zoom" class="zoom">
        <div class="zoom-cerrar" onclick="cerrarZoom()">X</div>
        <div id="zoom-contenido" class="zoom-contenido"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
